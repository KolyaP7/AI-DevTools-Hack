<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Праздничное агентство</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            font-size: 3em;
            margin-top: 50px;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff;
            position: relative;
            z-index: 10;
        }
        
        .snow {
            position: fixed;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            z-index: 9999;
            animation: fall linear infinite;
            pointer-events: none;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .form-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        
        input,
        button {
            margin: 15px 0;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            outline: none;
        }
        
        input:focus,
        button:focus {
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        
        button {
            cursor: pointer;
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
    </style>
</head>

<body>
    <video autoplay muted loop id="bg-video" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;">
        <source src="vecteezy_beautiful-christmas-tree-particles-background-video-loop_2014514.mp4" type="video/mp4">
    </video>
    <h1>Праздничное агентство</h1>

    <!-- Контейнер для снежинок -->
    <div id="snowflakes-container"></div>

    <div class="form-container">
        <h2>Загрузите видео и напишите имя</h2>
        <form id="videoForm">
            <input type="file" id="videoFile" accept="video/*" required>
            <input type="text" id="userName" placeholder="Ваше имя" required>
            <button type="submit">Отправить</button>
        </form>
        <div id="result" style="display: none; margin-top: 20px;">
            <h3>Обработанное видео:</h3>
            <video id="processedVideo" controls preload="metadata" style="max-width: 100%; min-height: 200px; border: 1px solid #ccc; background: #000;"></video>
            <br>
            <button id="downloadBtn" style="margin-top: 10px;">Скачать видео</button>
            <div id="debugInfo" style="margin-top: 10px; font-size: 12px; color: #666;"></div>
        </div>
    </div>

    <script>
        // Функция создания снежинок
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes-container');

            for (let i = 0; i < 100; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snow';

                // Случайные параметры для каждой снежинки
                snowflake.style.left = `${Math.random() * 100}vw`;
                snowflake.style.animationDuration = `${Math.random() * 10 + 5}s`;
                snowflake.style.animationDelay = `${Math.random() * 5}s`;
                snowflake.style.width = `${Math.random() * 8 + 2}px`;
                snowflake.style.height = snowflake.style.width;

                snowflakesContainer.appendChild(snowflake);
            }
        }

        // Инициализация снежинок при загрузке страницы
        document.addEventListener('DOMContentLoaded', createSnowflakes);

        // Обработка формы загрузки видео
        document.getElementById('videoForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const videoFile = document.getElementById('videoFile').files[0];
            const userName = document.getElementById('userName').value.trim();

            if (!videoFile) {
                alert('Пожалуйста, выберите видеофайл.');
                return;
            }

            if (!userName) {
                alert('Пожалуйста, введите ваше имя.');
                return;
            }

            // Показать индикатор загрузки
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Обработка...';
            submitBtn.disabled = true;

            // Остановить фоновое видео для экономии ресурсов
            const bgVideo = document.getElementById('bg-video');
            if (bgVideo) {
                bgVideo.pause();
            }

            try {
                // Отправка данных на сервер
                const formData = new FormData();
                formData.append('video', videoFile);
                formData.append('name', userName);

                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    // Показать обработанное видео
                    const resultDiv = document.getElementById('result');
                    const videoElement = document.getElementById('processedVideo');
                    const downloadBtn = document.getElementById('downloadBtn');

                    // Clear any existing video
                    videoElement.src = '';
                    videoElement.load();

                    const videoUrl = `/videos/${result.processed_video}`;
                    console.log('Setting video source to:', videoUrl);
                    console.log('Full result:', result);

                    const debugInfo = document.getElementById('debugInfo');
                    debugInfo.innerHTML = `
                        <strong>Debug Info:</strong><br>
                        Video URL: ${videoUrl}<br>
                        Processed video: ${result.processed_video}<br>
                        Message: ${result.message}
                    `;

                    videoElement.src = videoUrl;
                    videoElement.load(); // Force reload

                    // Add event listeners for debugging
                    videoElement.addEventListener('loadstart', () => {
                        console.log('Video load started');
                        debugInfo.innerHTML += '<br>Status: Loading started';
                    });
                    videoElement.addEventListener('loadeddata', () => {
                        console.log('Video data loaded');
                        debugInfo.innerHTML += '<br>Status: Data loaded';
                    });
                    videoElement.addEventListener('error', (e) => {
                        console.error('Video error:', e);
                        debugInfo.innerHTML += `<br>Status: Error - ${e.target.error ? e.target.error.code : 'Unknown error'}`;
                    });
                    videoElement.addEventListener('canplay', () => {
                        console.log('Video can play');
                        debugInfo.innerHTML += '<br>Status: Can play';
                    });
                    videoElement.addEventListener('abort', () => {
                        console.log('Video load aborted');
                        debugInfo.innerHTML += '<br>Status: Load aborted';
                    });
                    videoElement.addEventListener('stalled', () => {
                        console.log('Video stalled');
                        debugInfo.innerHTML += '<br>Status: Stalled';
                    });

                    downloadBtn.onclick = () => {
                        const a = document.createElement('a');
                        a.href = videoUrl;
                        a.download = result.processed_video;
                        a.click();
                    };

                    resultDiv.style.display = 'block';
                    alert(result.message);
                } else {
                    alert('Ошибка обработки видео: ' + result.message);
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                // Возобновить фоновое видео
                const bgVideo = document.getElementById('bg-video');
                if (bgVideo) {
                    bgVideo.play();
                }
            }
        });
    </script>
</body>

</html>
