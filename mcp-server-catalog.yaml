# Конфигурация MCP сервера для обработки видео
id: "mcp-server-video-processing"
name: "MCP Server Video Processing"
description: |
  MCP сервер для обработки видео с использованием Whisper, Wav2Lip и других инструментов.
  Включает инструменты для распознавания речи, наложения губ, замены сегментов видео
  и генерации TTS аудио с логированием, прогресс-отчетами,
  OpenTelemetry трейсингом и обработкой ошибок.
tools:
  - name: "get_text_from_video"
    description: "Инструмент для получения текста с временными метками из видео с использованием Whisper"
    parameters:
      fileName: "string - Имя файла видео"
  - name: "cut_and_overlay_lips"
    description: "Инструмент для вырезания сегментов из видео и наложения губ с использованием Wav2Lip"
    parameters:
      segments: "array - Список сегментов для обработки"
      videoPath: "string - Путь к исходному видео файлу"
      audioPath: "string - Путь к аудио файлу для наложения"
  - name: "replace_video_segments"
    description: "Инструмент для замены сегментов видео с использованием ffmpeg"
    parameters:
      videoPath: "string - Путь к исходному видео файлу"
      replacements: "array - Список замен сегментов видео"
      outputPath: "string - Путь к выходному видео файлу"
  - name: "generate_tts_audio"
    description: "Инструмент для генерации TTS аудио с использованием FastSpeech 2 + Vocoder"
    parameters:
      text: "string - Текст для синтеза речи"
      language: "string - Язык синтеза (например, 'ru', 'en')"
      speaker: "string - Выбор голоса/спикера"
rawEnvs:
  PORT:
    isRequired: false
    description: "Порт MCP сервера"
  HOST:
    isRequired: false
    description: "Хост для прослушивания сервера"
  MCP_SERVER_NAME:
    isRequired: false
    description: "Имя MCP сервера"
  OTEL_ENDPOINT:
    isRequired: false
    description: "OpenTelemetry endpoint для экспорта трейсов"
  OTEL_SERVICE_NAME:
    isRequired: false
    description: "Имя сервиса для OpenTelemetry"
  LOG_LEVEL:
    isRequired: false
    description: "Уровень логирования"
secretEnvs:
  API_KEY:
    isRequired: false
    description: "API ключ для доступа к сервису (если требуется)"
image_uri: ${IMAGE_URI}
license_url: "https://example.com/license"
tags: ["example", "demo", "mcp"]
category: "Development"
versions: ["1.0.0"]
exposed_ports:
  - port: 8000
    protocol: "HTTP"
status: "MCP_SERVER_PREDEFINED_STATUS_AVAILABLE"
type: "MCP_SERVER_PREDEFINED_TYPE_INTERNAL"

