# Конфигурация MCP сервера
id: "mcp-server-example"
name: "MCP Server Example"
description: |
  Пример MCP сервера, демонстрирующий стандарт разработки.
  Включает примеры инструментов с логированием, прогресс-отчетами,
  OpenTelemetry трейсингом и обработкой ошибок.
tools:
  - name: "get_text_from_video"
    description: "📝 Инструмент для получения текста с временными метками из видео"
    parameters:
      fileName: "string - Имя файла видео"
  - name: "generate_tts_audio"
    description: "🔊 Инструмент для генерации TTS аудио с использованием FastSpeech 2 + Vocoder"
    parameters:
      text: "string - Текст для озвучивания"
      output_file: "string - Имя выходного аудиофайла"
      segments: "array (optional) - Сегменты с временными метками для генерации в нужные моменты"
  - name: "replace_video_segments"
    description: "🎬 Инструмент для замены сегментов в видео на отредактированные куски с использованием ffmpeg"
    parameters:
      original_video: "string - Имя оригинального видеофайла"
      segments: "array - [{start: float, end: float, replacement_video: str}]"
      output_video: "string - Имя выходного видеофайла"
  - name: "cut_and_overlay_lips"
    description: "🎬 Инструмент для вырезания сегментов из видео и наложения губ (lip-sync) на каждый сегмент с использованием Wav2Lip"
    parameters:
      video_file: "string - Имя исходного видеофайла (в VIDEO_PATH)"
      segments: "array - [{start: float, end: float, audio_name: str}]"
rawEnvs:
  PORT:
    isRequired: false
    description: "Порт MCP сервера"
  HOST:
    isRequired: false
    description: "Хост для прослушивания сервера"
  MCP_SERVER_NAME:
    isRequired: false
    description: "Имя MCP сервера"
  OTEL_ENDPOINT:
    isRequired: false
    description: "OpenTelemetry endpoint для экспорта трейсов"
  OTEL_SERVICE_NAME:
    isRequired: false
    description: "Имя сервиса для OpenTelemetry"
  LOG_LEVEL:
    isRequired: false
    description: "Уровень логирования"
secretEnvs:
  API_KEY:
    isRequired: false
    description: "API ключ для доступа к сервису (если требуется)"
image_uri: ${IMAGE_URI}
license_url: "https://example.com/license"
tags: ["example", "demo", "mcp"]
category: "Development"
versions: ["1.0.0"]
exposed_ports:
  - port: 8000
    protocol: "HTTP"
status: "MCP_SERVER_PREDEFINED_STATUS_AVAILABLE"
type: "MCP_SERVER_PREDEFINED_TYPE_INTERNAL"

